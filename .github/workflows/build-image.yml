name: 构建二开镜像

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，留空则自动使用作者最新 Release"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 获取版本
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ inputs.version }}" ]]; then
            tag="${{ inputs.version }}"
            tag="${tag#v}"
          else
            tag="$(curl -fsSL \
              https://api.github.com/repos/kiss-kedaya/sub2api/releases/latest \
              | jq -r '.tag_name')"
            tag="${tag#v}"
          fi

          test -n "$tag"
          test "$tag" != "null"

          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "tag=v$tag" >> "$GITHUB_OUTPUT"
          echo "构建版本：$tag"

      - name: 下载作者源码
        run: |
          git clone --depth 1 \
            --branch "${{ steps.version.outputs.tag }}" \
            https://github.com/kiss-kedaya/sub2api.git source

      - name: 修正 Dockerfile 的 Go 版本
        run: |
          set -euo pipefail
          echo "---- 修改前 ----"
          grep -n "golang:\|GOTOOLCHAIN" source/Dockerfile || true

          # 把所有 golang 基础镜像的小版本统一换成 1.26.10，兼容带后缀的写法
          sed -i -E 's#(FROM[[:space:]]+golang:1\.26\.[0-9]+)#FROM golang:1.26.10#g' source/Dockerfile
          # 如果上游是 golang:1.26 这种没小版本的，补成 1.26.10
          sed -i -E 's#(FROM[[:space:]]+)golang:1\.26([[:space:]]|$)#\1golang:1.26.10\2#g' source/Dockerfile
          # 放开工具链自动下载，避免 GOTOOLCHAIN=local 卡死
          sed -i 's#GOTOOLCHAIN=local#GOTOOLCHAIN=auto#g' source/Dockerfile

          echo "---- 修改后 ----"
          grep -n "golang:\|GOTOOLCHAIN" source/Dockerfile || true

          # 如果改完还是 1.26.9，说明上游写法不一样，直接失败方便排查
          if grep -q "golang:1\.26\.9" source/Dockerfile; then
            echo "::error::Dockerfile 里仍存在 golang:1.26.9，请手动确认上游写法"
            exit 1
          fi

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: ./source
          file: ./source/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/z495408603/sub2api-kedaya:${{ steps.version.outputs.version }}
            ghcr.io/z495408603/sub2api-kedaya:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
