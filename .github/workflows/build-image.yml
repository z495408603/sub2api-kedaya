name: 构建二开镜像

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，留空则自动使用作者最新 Release"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 获取版本
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ inputs.version }}" ]]; then
            tag="${{ inputs.version }}"
            tag="${tag#v}"
          else
            tag="$(curl -fsSL \
              https://api.github.com/repos/kiss-kedaya/sub2api/releases/latest \
              | jq -r '.tag_name')"
            tag="${tag#v}"
          fi

          test -n "$tag"
          test "$tag" != "null"

          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "tag=v$tag" >> "$GITHUB_OUTPUT"
          echo "构建版本：$tag"

      - name: 下载作者源码
        run: |
          git clone --depth 1 \
            --branch "${{ steps.version.outputs.tag }}" \
            https://github.com/kiss-kedaya/sub2api.git source

      # 这一步已经不需要了，因为上游源码已经是 1.26.11，且我们通过 build-args 强覆盖
      # - name: 修正 Dockerfile 的 Go 版本 ...

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: ./source
          file: ./source/Dockerfile
          platforms: linux/amd64
          push: true
          # 注意：通过 build-args 强行把上游的变量覆盖为你想要的版本
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GOLANG_IMAGE=golang:1.26.11-alpine
            GOPROXY=https://goproxy.cn,direct
          tags: |
            ghcr.io/z495408603/sub2api-kedaya:${{ steps.version.outputs.version }}
            ghcr.io/z495408603/sub2api-kedaya:latest
          # 千万别加 cache-from 和 cache-to，或者强制 no-cache
          no-cache: true
