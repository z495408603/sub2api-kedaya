name: 构建二开镜像

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，留空则自动使用作者最新 Release"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 获取版本
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ inputs.version }}" ]]; then
            tag="${{ inputs.version }}"
            tag="${tag#v}"
          else
            tag="$(curl -fsSL \
              https://api.github.com/repos/kiss-kedaya/sub2api/releases/latest \
              | jq -r '.tag_name')"
            tag="${tag#v}"
          fi

          test -n "$tag"
          test "$tag" != "null"

          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "tag=v$tag" >> "$GITHUB_OUTPUT"
          echo "构建版本：$tag"

      - name: 下载作者源码
        run: |
          git clone --depth 1 \
            --branch "${{ steps.version.outputs.tag }}" \
            https://github.com/kiss-kedaya/sub2api.git source

      - name: 修正 Dockerfile 的 Go 版本
        run: |
          set -euo pipefail
          echo "---- 修改前 ----"
          cat source/Dockerfile | head -n 20

          # 1. 暴力替换 Dockerfile 中所有 1.26.x 的版本号为 1.26.11
          # 这是为了防止上游使用了 ARG GOLANG_VERSION=1.26.10 这样的变量定义
          sed -i -E 's#1\.26\.[0-9]+#1.26.11#g' source/Dockerfile
          
          # 2. 把所有的 local 替换为 auto
          sed -i 's#GOTOOLCHAIN=local#GOTOOLCHAIN=auto#g' source/Dockerfile
          
          # 3. 终极兜底：直接在 Dockerfile 第一行强行注入环境变量，无视上游写法
          sed -i '1i ENV GOTOOLCHAIN=auto' source/Dockerfile

          echo "---- 修改后 ----"
          cat source/Dockerfile | head -n 25

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: ./source
          file: ./source/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GOLANG_IMAGE=golang:1.26.11-alpine
            GOLANG_VERSION=1.26.11
          tags: |
            ghcr.io/z495408603/sub2api-kedaya:${{ steps.version.outputs.version }}
            ghcr.io/z495408603/sub2api-kedaya:latest
          # 注意：这里去掉了 cache-from 和 cache-to
          # 因为之前的构建失败可能污染了 GHA 缓存，导致它一直用旧的 1.26.10 镜像
